name: Publish 🚀

on:
  workflow_dispatch:
  push:
    branches:
    - main

env:
  AZURE_WEBAPP_NAME: utc-time-service
  # AZURE_WEBAPP_PACKAGE_PATH: "./publish"
  AZURE_WEBAPP_PACKAGE_PATH: "./CurrentTimeService/publish"
  PUBLISH_DIR: "./publish"

jobs:
  Publish:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
          
      - name: Restore
        run: dotnet restore ./CurrentTimeService.sln
        
      - name: Build
        run: dotnet build ./CurrentTimeService.sln --configuration Release --no-restore
        
      - name: Publish
        run: dotnet publish ./CurrentTimeService.sln --configuration Release --no-build --property:PublishDir=${{ env.PUBLISH_DIR }} --output '${{ env.AZURE_WEBAPP_PACKAGE_PATH }}'

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp 
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  Deploy:
    runs-on: ubuntu-latest
    needs: [Publish]

    steps:
      - name: Downlaod artifact from Publish job
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    
      - name: Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
      