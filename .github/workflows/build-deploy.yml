name: Publish 🚀

on:
  workflow_dispatch:
  push:
    branches:
    - main

env:
  AZURE_WEBAPP_NAME: utc-time-service
  # AZURE_WEBAPP_PACKAGE_PATH: "./publish"
  AZURE_WEBAPP_PACKAGE_PATH: "./CurrentTimeService/publish"
  PUBLISH_DIR: "./publish"

jobs:
  cleanup-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove artifacts older than 2 days
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 days'  # Adjust as needed
          # skip-tags: true  # Uncomment to keep release/tagged artifacts
          skip-recent: 1   # Uncomment to keep most recent 5 artifacts
  
